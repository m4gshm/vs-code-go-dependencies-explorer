name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 23.9.x ]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: static checks and coverage
        run: |
          npm ci
          npm run check-types
          npm run coverage
      - name: tests and package
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            npm run build
            npm run package
      - name: upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14
