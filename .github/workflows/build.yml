name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: static checks and coverage
        run: |
          npm ci
          npm run check-types
          npm run coverage
      - name: tests and package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run build
          xvfb-run -a npm run package
      - name: upload coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: upload vsix artifact
        uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14
