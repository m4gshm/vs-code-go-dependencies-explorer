name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 23.9.x ]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: tests and package
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            npm ci
            npm run check-types
            npm run vscode-test
            npm run test
            npm run lint
            npm run package
