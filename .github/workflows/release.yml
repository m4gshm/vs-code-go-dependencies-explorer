name: Handle Release
on:
  release:
    types: [published]
jobs:
  generate:
    name: create release-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: tests and package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm ci
          xvfb-run -a npm run build
          xvfb-run -a npm run package
      - name: publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: publish to Open VSX Registry
        run: npx ovsx publish --packagePath *.vsix
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: upload the artifacts
        run: gh release upload "${GITHUB_REF_NAME}" --clobber *.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
