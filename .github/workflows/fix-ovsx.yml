name: Fix Open VSX publish
on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.0.7'
jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: delete the broken version record
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${{ secrets.OPEN_VSX_TOKEN }}" \
            "https://open-vsx.org/api/m4gshm/vs-code-go-dependencies-explorer/${{ inputs.version }}")
          echo "delete status: $code"
      - name: download the release vsix
        run: gh release download "${{ inputs.version }}" --pattern '*.vsix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: republish
        run: npx ovsx publish --packagePath *.vsix -p "$OPEN_VSX_TOKEN"
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
